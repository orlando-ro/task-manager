<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Crear cuenta' if mode == 'register' else 'Iniciar sesión' }} - Gestor de Tareas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>{{ 'Crear cuenta' if mode == 'register' else 'Iniciar sesión' }}</h1>
            <p class="auth-subtitle">Gestor de Tareas</p>

            {% if error %}
                <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    {{ 'Registrarse' if mode == 'register' else 'Entrar' }}
                </button>
            </form>

            <p class="auth-switch">
                {% if mode == 'register' %}
                    ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
                {% else %}
                    ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a>
                {% endif %}
            </p>
        </section>
    </main>
</body>
</html>
