<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="container header-content">
                    <h1>Gestor de Tareas</h1>
                    <div id="header-actions" class="header-actions">
                        <span class="user-badge">{{ username }}</span>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline">Cerrar sesión</a>
                    </div>
                </div>
    </header>

    <main class="container" id="app-main">
            <section class="card" id="create-task-section">
                <h2>Nueva Tarea</h2>
                <div id="create-feedback" class="feedback hidden"></div>

                <form id="create-task-form" class="task-form">
                    <div class="form-group">
                        <label for="task-title">Título</label>
                        <input type="text" id="task-title" name="title" placeholder="Ej. Regar las plantas" required>
                    </div>

                    <div class="form-group">
                        <label for="task-description">Descripción</label>
                        <textarea id="task-description" name="description" rows="2" placeholder="Detalles opcionales..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-priority">Prioridad</label>
                            <select id="task-priority" name="priority">
                                <option value="Alta">Alta</option>
                                <option value="Media" selected>Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="task-due-date">Fecha límite</label>
                            <input type="date" id="task-due-date" name="due_date">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Agregar tarea</button>
                </form>
            </section>
            <section class="card" id="task-list-section">
                        <div class="list-header">
                            <h2>Mis Tareas <span id="task-count" class="task-count">(0)</span></h2>
                            <div class="list-controls">
                                <label for="filter-status" class="sr-only">Filtrar por estado</label>
                                <select id="filter-status">
                                    <option value="">Todos los estados</option>
                                    <option value="Pendiente">Pendientes</option>
                                    <option value="Completada">Completadas</option>
                                </select>
                                <label for="filter-priority" class="sr-only">Filtrar por prioridad</label>
                                <select id="filter-priority">
                                    <option value="">Todas las prioridades</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Media">Media</option>
                                    <option value="Baja">Baja</option>
                                </select>
                            </div>
                        </div>

                        <div id="task-list" class="task-list">
                            <p class="empty-state">Cargando tareas...</p>
                        </div>
                    </section>
        </main>

        <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="edit-modal-title">Editar Tarea</h2>
                        <button type="button" id="close-edit-modal" class="btn-close" aria-label="Cerrar">&times;</button>
                    </div>

                    <div id="edit-feedback" class="feedback hidden"></div>

                    <form id="edit-task-form" class="task-form">
                        <input type="hidden" id="edit-task-id" name="id">

                        <div class="form-group">
                            <label for="edit-title">Título</label>
                            <input type="text" id="edit-title" name="title" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-description">Descripción</label>
                            <textarea id="edit-description" name="description" rows="2"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="edit-priority">Prioridad</label>
                                <select id="edit-priority" name="priority">
                                    <option value="Alta">Alta</option>
                                    <option value="Media">Media</option>
                                    <option value="Baja">Baja</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="edit-status">Estado</label>
                                <select id="edit-status" name="status">
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Completada">Completada</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="edit-due-date">Fecha límite</label>
                            <input type="date" id="edit-due-date" name="due_date">
                        </div>

                        <div class="modal-actions">
                            <button type="button" id="cancel-edit-btn" class="btn btn-outline">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
